# Dependabot, tuned for a private repository on GitHub Free.
#
# Dependabot's own jobs are free, but every pull request it opens runs CI, which is not.
# So: one batch a month, timed for the monthly maintenance session that merges it
# (docs/sessions/maintenance.md); no automatic rebases (each rebase re-runs CI); a week of
# cooldown so a release that is replaced within days never reaches us; and every
# non-major update in one pull request per ecosystem. Majors arrive one by one, because
# each needs reading. Security updates are not on this schedule: GitHub opens them as soon
# as an advisory lands, when they are enabled in Settings → Advanced Security.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # A deliberate upper bound in pyproject.toml gets an `ignore` here with the reason, so
    # Dependabot does not reopen the same pull request every month. Example:
    # ignore:
    #   - dependency-name: cryptography
    #     versions: [">=51"]   # 51 drops finite-field DH, which the broker's handshake needs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Uncomment when the project ships a Dockerfile: base images are dependencies too.
  # - package-ecosystem: docker
  #   directory: /deploy
  #   schedule:
  #     interval: monthly
  #   open-pull-requests-limit: 1
  #   rebase-strategy: disabled
  #   groups:
  #     images:
  #       patterns: ["*"]
